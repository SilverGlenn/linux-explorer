name: Build and test

on:
  push:
    branches: [main, windows7-fidelity]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      require_google_drive_client:
        type: boolean
        default: false
    secrets:
      google_drive_client_json:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Qt/KIO regression suite (Arch, x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies, Explorer, and tests inside Arch
        env:
          GOOGLE_DRIVE_CLIENT_JSON: ${{ secrets.google_drive_client_json }}
          REQUIRE_GOOGLE_DRIVE_CLIENT: ${{ inputs.require_google_drive_client || false }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          value = os.environ.get("GOOGLE_DRIVE_CLIENT_JSON", "")
          if os.environ.get("REQUIRE_GOOGLE_DRIVE_CLIENT", "false").lower() == "true" and not value:
              raise SystemExit("The release requires Explorer's registered Desktop OAuth client.")
          path = Path(os.environ["RUNNER_TEMP"]) / "explorer-google-client.json"
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, "w") as stream:
              stream.write(value)
          PY
          unset GOOGLE_DRIVE_CLIENT_JSON
          docker run --rm -v "$PWD:/repo" \
            -v "$RUNNER_TEMP/explorer-google-client.json:/run/explorer-google-client.json:ro" \
            -e EXPLORER_REQUIRE_GOOGLE_DRIVE_CLIENT="$REQUIRE_GOOGLE_DRIVE_CLIENT" \
            -w /repo archlinux:base-devel bash -c '
            set -euo pipefail
            pacman -Syu --noconfirm --needed \
              git cmake ninja extra-cmake-modules qt6-base qt6-multimedia qt6-networkauth qtkeychain-qt6 \
              qt6-tools kio kcoreaddons kconfig kwidgetsaddons kwindowsystem \
              kcompletion solid frameworkintegration dbus kio-extras poppler python rclone fuse3 ttf-dejavu

            git clone https://gitgud.io/atmk/libaero-qt.git /tmp/libaero-qt
            cd /tmp/libaero-qt
            git submodule init deps/slidingstackedwidget
            git config submodule.deps/slidingstackedwidget.url \
              https://github.com/Qt-Widgets/SlidingStackedWidget-1.git
            git -c protocol.file.allow=always submodule update deps/slidingstackedwidget
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
            cmake --build build -j2
            cmake --install build

            cd /repo
            oauth_options=()
            if [[ -s /run/explorer-google-client.json ]]; then
              oauth_options+=(-DEXPLORER_GOOGLE_DRIVE_CLIENT_JSON=/run/explorer-google-client.json)
            fi
            cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
              -DEXPLORER_REQUIRE_GOOGLE_DRIVE_CLIENT="$EXPLORER_REQUIRE_GOOGLE_DRIVE_CLIENT" \
              "${oauth_options[@]}"
            cmake --build build -j2
            EXPLORER_SNAPSHOTS=/repo/build/screenshots \
              dbus-run-session -- ctest --test-dir build --output-on-failure
            cp build/explorer-win7 build/explorer-win7-x86_64
          '

      - name: Remove temporary maintainer client file
        if: always()
        run: rm -f -- "$RUNNER_TEMP/explorer-google-client.json"

      - uses: actions/upload-artifact@v4
        with:
          name: explorer-win7-linux-x86_64
          path: |
            build/explorer-win7-x86_64
            build/explorer-win7-google-drive
            build/explorer-win7-google-drive-sync
            docs/google-drive.md
            LICENSE
            README.md
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explorer-win7-test-results
          path: |
            build/Testing/Temporary/
            build/screenshots/
