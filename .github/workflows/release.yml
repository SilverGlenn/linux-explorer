name: Release fork binary

on:
  release:
    types: [published]

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: explorer-win7-linux-x86_64
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/build/explorer-win7-x86_64
            dist/LICENSE
          fail_on_unmatched_files: true

# This fork must never publish to actuallyaridan's upstream AUR package.
